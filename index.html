function specialSignal(j){if(!j.sourcePdf)return {color:'neutral',label:'Lieferstatus nicht erfasst',hint:'Für diesen Beispielauftrag gibt es keine erfasste Sonderteil-Lieferprüfung.'};let items=(j.deliveryItems||[]).filter(x=>x.special),total=items.reduce((n,x)=>n+x.qty,0),received=items.reduce((n,x)=>n+Math.min(x.qty,x.received||0),0);if(!total)return {color:'neutral',label:'Keine Sonderteile im Auftrag',hint:'Im überprüften Auftrag sind keine Sonderpositionen markiert.'};if(!received)return {color:'red',label:`Sonderteile fehlen · 0/${total}`,hint:'Noch keines der bestellten Sonderteile ist als vorhanden erfasst.'};if(received<total)return {color:'yellow',label:`Sonderteile teilweise da · ${received}/${total}`,hint:'Ein Teil der bestellten Sonderteile fehlt noch.'};return {color:'green',label:`Sonderteile vollständig · ${received}/${total}`,hint:'Alle bestellten Sonderteile sind als vorhanden erfasst.'}}
function signalHtml(j){let s=specialSignal(j);return `<span class="signal ${s.color}" aria-label="Lieferampel: ${esc(s.label)}">${s.color==='red'?'● Rot':s.color==='yellow'?'● Gelb':s.color==='green'?'● Grün':'● Neutral'} · ${esc(s.label)}</span>`}
function overview(){let relevant=jobs.filter(j=>partner()?true:true),done=jobs.filter(j=>j.status==='Abgeschlossen').length,mins=jobs.flatMap(j=>j.logs).reduce((a,l)=>a+Number(l.minutes||0),0),extra=jobs.flatMap(j=>j.extras).length;return layout(`<div class="metrics"><div class="metric"><small>Aufträge gesamt</small><strong>${relevant.length}</strong><small>im Demo-Arbeitsbereich</small></div><div class="metric"><small>In Arbeit</small><strong>${jobs.filter(j=>j.status==='In Arbeit').length}</strong><small>laufende Montagen</small></div><div class="metric"><small>Abgeschlossen</small><strong>${done}</strong><small>mit Kundenabnahme</small></div><div class="metric"><small>Erfasste Zeit</small><strong>${(mins/60).toLocaleString('de-DE',{maximumFractionDigits:1})} h</strong><small>${extra} Sonderleistungen</small></div></div><div class="grid"><section class="panel"><div class="panelhead"><h2>Nächste Einbauten</h2><button class="btn small" data-go="jobs">Alle Aufträge</button></div>${jobs.slice().sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999')).map(jobCard).join('')}</section><section class="panel"><h2>Ihr nächster Schritt</h2><p>${partner()?'Öffnen Sie einen Auftrag, starten Sie die Zeiterfassung und dokumentieren Sie Montage, Fotos und Abnahme.':office()?'Planen Sie Termine, halten Sie Rückfragen fest und prüfen Sie Abnahmen und Sonderleistungen.':'Sehen Sie den Fortschritt Ihrer Kundenaufträge und ergänzen Sie Hinweise für den Einbau.'}</p><div class="notice">Auftragsangaben und Prüfpunkte orientieren sich an den bereitgestellten RECA-Vorlagen. Die angezeigten Kunden und Termine sind erfundene Beispieldaten.</div>${partner()?'<p><button class="btn primary" data-go="upload">Auftrag aus E-Mail hochladen</button></p>':''}<button class="btn primary" data-go="calendar">Terminkalender öffnen</button></section></div>`,'Übersicht','Ihr Arbeitsstand auf einen Blick.')}
function jobCard(j){return `<button class="job" data-open="${j.id}"><span class="spread"><span class="jobtitle">${esc(j.customer)}</span>${chip(j.status)}</span><span class="meta">${esc(j.id)} · ${esc(j.vehicle)} · ${esc(j.plate)}</span><br><span class="meta">${j.date?`${fmt(j.date)} · ${esc(j.time)} Uhr`:'Termin noch offen'} · ${esc(j.place)}</span>${j.sourcePdf?`<br><span style="display:inline-block;margin-top:8px">${signalHtml(j)}</span>`:''}</button>`}
function allJobs(){let found=jobs.filter(j=>(filter==='Alle'||j.status===filter)&&`${j.id} ${j.customer} ${j.vehicle} ${j.place}`.toLowerCase().includes(query.toLowerCase()));return layout(`<div class="filters">${partner()?'<button class="btn primary" data-go="upload">+ E-Mail-Auftrag hochladen</button>':''}<div class="field" style="flex:2;min-width:180px"><label for="search">Suche</label><input id="search" placeholder="Kunde, Fahrzeug oder Auftragsnummer" value="${esc(query)}"></div><div class="field" style="flex:1;min-width:150px"><label for="filter">Status</label><select id="filter">${['Alle','Lieferung prüfen','Termin offen','Geplant','In Arbeit','Klärung','Abgeschlossen'].map(x=>`<option ${filter===x?'selected':''}>${x}</option>`).join('')}</select></div></div><section class="panel"><div class="panelhead"><h2>Auftragsliste</h2><span class="meta">${found.length} Ergebnisse</span></div>${found.length?found.map(jobCard).join(''):'<div class="empty">Keine passenden Aufträge gefunden.</div>'}</section>`,'Aufträge','Suchen, öffnen und nach Status filtern.')}
function calendar(){let [year,mon]=month.split('-').map(Number),first=new Date(year,mon-1,1),offset=(first.getDay()+6)%7,days=new Date(year,mon,0).getDate(),cells=[];for(let i=0;i<offset;i++)cells.push('<div class="day out" aria-hidden="true"></div>');for(let d=1;d<=days;d++){let stamp=`${year}-${String(mon).padStart(2,'0')}-${String(d).padStart(2,'0')}`,events=jobs.filter(j=>j.date===stamp);cells.push(`<div class="day"><span class="daynum">${d}</span>${events.map(j=>`<button class="event ${specialSignal(j).color}" data-open="${j.id}" aria-label="${esc(j.customer)} am ${fmt(j.date)}; ${esc(specialSignal(j).label)}">${esc(j.time)}<br>${esc(j.customer)}</button>`).join('')}</div>`)}let label=new Intl.DateTimeFormat('de-DE',{month:'long',year:'numeric'}).format(first);return layout(`<div class="panel"><div class="panelhead"><div class="row"><button class="btn small" data-month="-1" aria-label="Vorheriger Monat">←</button><h2 style="min-width:185px;text-align:center;text-transform:capitalize">${esc(label)}</h2><button class="btn small" data-month="1" aria-label="Nächster Monat">→</button></div><span class="meta">Termine öffnen per Tippen</span></div><div class="calendar">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(x=>`<div class="dayhead">${x}</div>`).join('')}${cells.join('')}</div></div><div class="panel"><h3>Termine in diesem Monat</h3>${jobs.filter(j=>j.date.startsWith(month)).length?jobs.filter(j=>j.date.startsWith(month)).map(jobCard).join(''):'<div class="empty">Für diesen Monat sind keine Beispieltermine eingetragen.</div>'}</div>`,'Terminkalender',partner()?'Einbauplanung für unterwegs.':'Überblick über alle geplanten Einbauten.')}
function analytics(){let total=jobs.length,complete=jobs.filter(j=>j.status==='Abgeschlossen').length,mins=jobs.flatMap(j=>j.logs).reduce((a,l)=>a+Number(l.minutes||0),0),ex=jobs.flatMap(j=>j.extras).length,groups=['Lieferung prüfen','Termin offen','Geplant','In Arbeit','Klärung','Abgeschlossen'];return layout(`<div class="metrics"><div class="metric"><small>Einbauten</small><strong>${total}</strong><small>erfasste Aufträge</small></div><div class="metric"><small>Abnahmen</small><strong>${complete}</strong><small>abgeschlossene Aufträge</small></div><div class="metric"><small>Einbauzeit</small><strong>${(mins/60).toLocaleString('de-DE',{maximumFractionDigits:1})} h</strong><small>erfasste Arbeitszeit</small></div><div class="metric"><small>Sonderleistungen</small><strong>${ex}</strong><small>erfasste Positionen</small></div></div><div class="grid"><section class="panel"><h2>Statusverteilung</h2>${groups.map(g=>`<div class="barrow"><span>${g}</span><div class="bar" role="img" aria-label="${g}: ${jobs.filter(j=>j.status===g).length} von ${total}"><i style="width:${total?jobs.filter(j=>j.status===g).length/total*100:0}%"></i></div><strong>${jobs.filter(j=>j.status===g).length}</strong></div>`).join('')}</section><section class="panel"><h2>Export</h2><p>Auftragsdaten als CSV oder JSON zur weiteren Auswertung exportieren. Der Export enthält nur Daten dieser Demo-Sitzung.</p><div class="row"><button class="btn" data-act="csv">CSV exportieren</button><button class="btn" data-act="json">JSON exportieren</button></div></section></div><section class="panel"><h2>Einbauzeiten je Auftrag</h2>${jobs.map(j=>`<div class="listrow spread"><span><strong>${esc(j.id)}</strong> · ${esc(j.customer)}</span><span>${(j.logs.reduce((a,l)=>a+Number(l.minutes||0),0)/60).toLocaleString('de-DE',{maximumFractionDigits:1})} h</span></div>`).join('')}</section>`,'Auswertung','Kennzahlen aus den aktuell erfassten Demo-Aufträgen.')}
function delivery(j){let items=j.deliveryItems||[],done=items.filter(x=>x.received>=x.qty).length,groups=[['Sonderpositionen',items.map((x,i)=>({x,i})).filter(v=>v.x.special)],['Weitere Lieferteile',items.map((x,i)=>({x,i})).filter(v=>!v.x.special)]];return `<section class="panel"><div class="panelhead"><h2>Lieferstatus und Vollständigkeit</h2><span class="pill ${j.deliveryApproved?'done':'block'}">${j.deliveryApproved?'Lieferprüfung bestätigt':done+' / '+items.length+' Lieferpositionen vollständig'}</span></div>${j.sourcePdf?`<div class="notice">${signalHtml(j)}<br><span style="display:inline-block;margin-top:8px">${esc(specialSignal(j).hint)} Die Terminvereinbarung ist unabhängig von dieser Ampel jederzeit möglich.</span></div>`:'<p class="meta">Für diese Beispielaufträge wurde keine Liefercheckliste importiert.</p>'}${items.length?groups.map(([title,rows])=>rows.length?`<h3>${title} (${rows.length})</h3>${rows.map(({x,i})=>`<div class="deliveryrow ${x.special?'special':''}"><div><strong>${esc(x.name)}</strong><small>${esc(x.section)}${x.article?' · Artikel '+esc(x.article):''}</small><span class="qty">Soll: ${x.qty} St. · Ist: ${x.received||0} St.</span></div><div><label class="tick"><input type="checkbox" data-delivery="${i}" ${x.received>=x.qty?'checked':''} ${!partner()?'disabled':''}>vollständig</label>${partner()?`<div class="field"><label for="received-${i}">Ist-Menge</label><input id="received-${i}" type="number" min="0" max="${x.qty}" step="1" value="${x.received||0}" data-received="${i}"></div>`:''}</div></div>`).join('')}`:'').join(''):'<div class="empty">Keine Lieferpositionen hinterlegt.</div>'}${items.length&&partner()?`<hr class="divider"><div class="field"><label for="delivery-issue">Fehlende / beschädigte Teile oder Rückfrage</label><textarea id="delivery-issue" placeholder="z. B. Spannungswandler fehlt; Lieferung nachfordern">${esc(j.deliveryIssue||'')}</textarea></div><p><button class="btn" data-act="delivery-issue">Abweichung dokumentieren</button></p><label style="display:flex;gap:9px;align-items:start"><input type="checkbox" id="delivery-confirm" ${j.deliveryApproved?'checked':''}> Ich habe die vollständige PDF-Stückliste einschließlich Sonderpositionen mit der tatsächlichen Lieferung verglichen.</label><p><button class="btn primary" data-act="delivery-approve">Lieferprüfung abschließen</button></p>`:''}${j.deliveryIssue?`<div class="notice warn">Abweichung: ${esc(j.deliveryIssue)}</div>`:''}${j.deliveryApproved?`<p class="footnote">Bestätigt durch ${esc(j.deliveryBy||'–')} am ${esc(j.deliveryAt||'–')}.</p>`:''}</section>`}
function details(){let j=job();let tabs=[['order','Auftrag'],['delivery','Lieferprüfung'],['work','Dokumentation'],['accept','Abnahme'],['handover','Übergabe'],['chat','Kommunikation']];return layout(`<div class="detailtop"><button class="btn text small" data-go="jobs">← Zur Auftragsliste</button><div class="spread"><span class="meta">${esc(j.id)} · ${esc(j.offer)}</span>${chip(j.status)}</div></div><div class="tabs" role="tablist" aria-label="Auftragsbereiche">${tabs.map(([id,n])=>`<button class="tab ${tab===id?'on':''}" role="tab" aria-selected="${tab===id}" data-tab="${id}">${n}</button>`).join('')}</div>${tab==='order'?order(j):tab==='delivery'?delivery(j):tab==='work'?work(j):tab==='accept'?acceptance(j):tab==='handover'?handover(j):chat(j)}`,j.customer,`${j.vehicle} · ${j.plate} · ${j.place}`)}
function order(j){return `<div class="grid"><section class="panel"><h2>Einbauauftrag</h2><div class="listrow spread"><span>Termin</span><strong>${j.date?`${fmt(j.date)} · ${esc(j.time)} Uhr`:'Noch nicht vereinbart'}</strong></div><div class="listrow spread"><span>Ort</span><strong>${esc(j.place)}</strong></div><div class="listrow spread"><span>Einbaupartner</span><strong>${esc(j.partner)}</strong></div><div class="listrow spread"><span>Außendienst</span><strong>${esc(j.rep)}</strong></div><div class="listrow spread"><span>Geplante Montagekosten</span><strong>${j.planned.toLocaleString('de-DE',{style:'currency',currency:'EUR'})}</strong></div><p class="summary">Hinweis: ${esc(j.notes)}</p>${j.sourcePdf?`<div class="notice fileline"><strong>Vom Einbaupartner hochgeladen:</strong> ${esc(j.sourcePdf.name)}<br><button class="btn small" data-act="source-pdf">Original-PDF herunterladen</button><br><small>Original nur während dieser Demo-Sitzung verfügbar.</small></div>`:''}${(office()||(partner()&&j.sourcePdf))?`<div class="appointment ${specialSignal(j).color}"><h3>Terminvereinbarung</h3><p>${signalHtml(j)}</p><p class="footnote">${esc(specialSignal(j).hint)} Der Termin kann unabhängig vom Lieferstatus vereinbart und geändert werden.</p><div class="formgrid">${field('Einbaudatum','schedule-date',j.date,'date')}${field('Beginn','schedule-time',j.time,'time')}${field('Einbaupartner','schedule-partner',j.partner)}<div class="field"><label for="schedule-status">Status</label><select id="schedule-status">${partner()&&j.sourcePdf?'<option value="Geplant">Geplant</option>':['Geplant','In Arbeit','Klärung','Abgeschlossen'].map(s=>`<option ${j.status===s?'selected':''}>${s}</option>`).join('')}</select></div></div><p><button class="btn primary" data-act="schedule">${j.date?'Termin ändern':'Termin vereinbaren'}</button></p></div>`:''}</section><section class="panel"><h2>Stückliste</h2>${j.parts.map((p,i)=>`<div class="listrow"><span class="meta">Position ${i+1}</span><br>${esc(p)}</div>`).join('')}<div class="notice">Die Stückliste ist in diesem Prototyp nur zur Ansicht. Rückfragen können im Bereich „Kommunikation“ festgehalten werden.</div></section></div>`}
function work(j){return `<div class="grid"><section class="panel"><h2>Arbeitszeit</h2>${partner()?`<div class="row"><button class="btn ${j.start?'danger':'primary'}" data-act="timer">${j.start?'Arbeitszeit stoppen':'Arbeitszeit starten'}</button>${j.start?'<span class="pill progress">Zeiterfassung läuft</span>':''}</div><hr class="divider"><div class="formgrid">${field('Tätigkeit','task','Montage')}${field('Minuten','minutes','','number')}</div><p><button class="btn" data-act="log">Zeit manuell eintragen</button></p>`:''}${j.logs.length?j.logs.map(l=>`<div class="listrow spread"><span>${esc(l.task)}<br><small class="meta">${esc(l.at)}</small></span><strong>${l.minutes} min</strong></div>`).join(''):'<div class="empty">Noch keine Arbeitszeit erfasst.</div>'}<p class="summary">Gesamt: ${j.logs.reduce((a,l)=>a+Number(l.minutes||0),0)} Minuten</p></section><section class="panel"><h2>Sonderleistungen</h2>${partner()?`<div class="formgrid">${field('Leistung / Beschreibung','extra-title','','text','wide')}${field('Aufwand in Minuten','extra-min','','number')}<div class="field"><label for="extra-note">Begründung</label><input id="extra-note" placeholder="Warum war die Zusatzleistung nötig?"></div></div><p><button class="btn" data-act="extra">Sonderleistung erfassen</button></p>`:''}${j.extras.length?j.extras.map(e=>`<div class="listrow"><strong>${esc(e.title)}</strong> · ${e.minutes} min<br><span class="meta">${esc(e.note)} · ${esc(e.at)}</span></div>`).join(''):'<div class="empty">Noch keine Sonderleistungen erfasst.</div>'}</section></div><section class="panel"><h2>Fotodokumentation</h2>${partner()?`<div class="field"><label for="photo">Foto aufnehmen oder auswählen (max. 5 MB je Bild)</label><input type="file" id="photo" accept="image/*" capture="environment"></div>`:''}${j.photos.length?j.photos.map(p=>`<img class="uploadthumb" src="${p.data}" alt="Dokumentationsfoto ${esc(p.name)}" title="${esc(p.name)}">`).join(''):'<p class="meta">Noch keine Fotos hinzugefügt.</p>'}<p class="footnote">Fotos bleiben nur in der laufenden Demo-Sitzung gespeichert.</p></section>`}
function acceptance(j){let a=j.accept,checked=checks.filter(([key])=>j.checks[key]).length;return `<section class="panel"><div class="panelhead"><h2>Abnahme-Checkliste</h2><span class="pill">${checked} / ${checks.length} geprüft</span></div><div class="notice warn">Eine Karosseriebohrung muss vorab mit dem Kunden abgestimmt und separat unterschrieben werden. Dieser Prototyp ersetzt keine rechtliche Prüfung.</div>${checks.map(([key,label])=>`<div class="checkrow"><span>${esc(label)}</span><div class="seg" role="group" aria-label="${esc(label)}">${['Ja','Nein','N/A'].map(v=>`<button type="button" aria-pressed="${j.checks[key]===v}" class="${j.checks[key]===v?'on':''}" data-check="${key}" data-value="${v}" ${!partner()?'disabled':''}>${v}</button>`).join('')}</div></div>`).join('')}<hr class="divider"><div class="formgrid">${field('Abweichungen / Bemerkungen','deviation',a.deviation||'','text','wide')}${field('Name der abnehmenden Person','customer-name',a.customer||'')}<div class="field"><label for="drilling">Karosseriebohrung durchgeführt?</label><select id="drilling"><option value="nein" ${a.drilling!=='ja'?'selected':''}>Nein</option><option value="ja" ${a.drilling==='ja'?'selected':''}>Ja</option></select></div><label class="wide"><input type="checkbox" id="drill-consent" ${a.drillConsent?'checked':''}> Separate Zustimmung/Unterschrift zur Bohrung liegt außerhalb dieser Demo vor</label></div><p class="summary">Die Abnahme-Checkliste dient zugleich als Fertigmeldung. Bitte alle Prüfpunkte beantworten und Abweichungen dokumentieren.</p><h3>Unterschrift zur Abnahme</h3>${a.signature?`<img src="${a.signature}" alt="Erfasste Kundenunterschrift" style="max-width:100%;height:100px;border:1px solid var(--line)"><p class="meta">Erfasst am ${esc(a.signedAt||'–')}</p>`:`<canvas class="signature" id="signature" aria-label="Unterschriftsfeld für den Kunden"></canvas><p class="footnote">Mit Maus oder Finger unterschreiben. Die Unterschrift wird nur in dieser Sitzung gehalten.</p>`}<div class="row">${!a.signature?`<button class="btn" data-act="clear-sign">Unterschrift löschen</button>`:''}<button class="btn primary" data-act="accept-save" ${!partner()?'disabled':''}>Abnahme festhalten</button></div>${!partner()?'<p class="footnote">Nur Einbaupartner können in dieser Demo eine Abnahme festhalten.</p>':''}</section>`}
function handover(j){let h=j.handover;return `<section class="panel"><h2>Fahrzeugübergabe</h2><div class="formgrid">${field('Übergabe am','handover-date',h.date||j.date,'date')}${field('Uhrzeit','handover-time',h.time||j.time,'time')}${field('Übergabeort','handover-place',h.place||j.place)}${field('Kilometerstand','handover-km',h.km||'','number')}${field('Übergebende Person','handover-from',h.from||'')}${field('Übernehmende Person','handover-to',h.to||'')}<div class="field"><label for="handover-outside">Fahrzeug außen</label><select id="handover-outside">${['Nicht erfasst','Gewaschen','Leicht verschmutzt','Stark verschmutzt'].map(s=>`<option ${h.outside===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label for="handover-inside">Innenraum</label><select id="handover-inside">${['Nicht erfasst','Sauber','Leicht verschmutzt','Stark verschmutzt'].map(s=>`<option ${h.inside===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label for="handover-tank">Tankfüllung</label><select id="handover-tank">${['Nicht erfasst','Leer','¼','½','¾','Voll'].map(s=>`<option ${h.tank===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label for="handover-fuel">Kraftstoffart</label><input id="handover-fuel" value="${esc(h.fuel||'')}"></div></div><hr class="divider"><h3>Übergebene Gegenstände</h3><div class="formgrid">${handItems.map((v,i)=>`<label style="display:flex;gap:9px;align-items:center"><input type="checkbox" data-item="${i}" ${j.handoverItems[i]?'checked':''} ${!partner()?'disabled':''}>${v}</label>`).join('')}</div><hr class="divider"><div class="formgrid"><div class="field wide"><label for="handover-damage">Schäden / Schäden bei Übergabe (Ort und Art beschreiben)</label><textarea id="handover-damage">${esc(h.damage||'')}</textarea></div><div class="field wide"><label for="handover-comment">Bemerkungen</label><textarea id="handover-comment">${esc(h.comment||'')}</textarea></div></div><p><button class="btn primary" data-act="handover-save" ${!partner()?'disabled':''}>Übergabe dokumentieren</button></p>${h.savedAt?`<div class="notice">Übergabe zuletzt dokumentiert: ${esc(h.savedAt)}. Eine zweite, separate Unterschriftenerfassung ist für die produktive Umsetzung vorgesehen.</div>`:''}</section>`}
function chat(j){return `<section class="panel"><h2>Auftragskommunikation</h2><p class="sub" style="margin-bottom:16px">Hinweise bleiben dem jeweiligen Auftrag zugeordnet.</p><div class="chat" aria-live="polite">${j.messages.length?j.messages.map(m=>`<div class="message"><strong>${esc(m.by)}</strong> <span class="meta">· ${esc(m.role)}</span><div>${esc(m.text)}</div><div class="meta">${esc(m.at)}</div></div>`).join(''):'<div class="empty">Noch keine Nachrichten. Stellen Sie die erste Rückfrage zum Auftrag.</div>'}</div><div class="field" style="margin-top:15px"><label for="message">Nachricht zum Auftrag</label><textarea id="message" maxlength="1500" placeholder="z. B. Rückfrage zur Bodenbefestigung oder zum Termin"></textarea></div><p><button class="btn primary" data-act="message">Nachricht hinzufügen</button></p><p class="footnote">Demo-Kommunikation ohne Benachrichtigungen und ohne Serverübertragung.</p></section>`}
function uploadView(){if(!partner())return overview();let s=pendingPdf?.suggest||{};return layout(`<section class="panel"><div class="uploadsteps"><span>1 · PDF aus E-Mail hochladen</span><span>2 · Stückliste prüfen</span><span>3 · Lieferampel ansehen</span><span>4 · Termin frei vereinbaren</span></div><h2>Einbauauftrag als PDF hinzufügen</h2><p>Speichern Sie den E-Mail-Anhang und wählen Sie die PDF-Datei aus. Die App liest Positionen aus der Stückliste und hebt mögliche Sonderpositionen hervor.</p><div class="uploadbox field"><label for="order-pdf">Einbauauftrag auswählen (PDF, maximal 10 MB)</label><input id="order-pdf" type="file" accept="application/pdf,.pdf"><span class="footnote">Der Prototyp liest Text aus den durchsuchbaren Auftrags-PDFs. Die Zuordnung einzelner Positionen kann je nach PDF-Layout unvollständig sein: Bitte die Liste mit dem Original abgleichen.</span></div>${pdfMessage?`<div class="notice warn" role="status">${esc(pdfMessage)}</div>`:''}${pendingPdf?`<div class="notice fileline"><strong>Gewählt:</strong> ${esc(pendingPdf.file.name)} · ${(pendingPdf.file.size/1024).toFixed(0)} KB. Prüfen Sie alle Vorschläge anhand der Original-PDF.</div>${pendingPdf.status==='selected'?'<p><button class="btn primary" style="width:100%" data-act="upload-parse">PDF hochladen und auslesen</button></p>':pendingPdf.status==='reading'?'<div class="notice">PDF wird gerade gelesen …</div>':''}<div class="reviewgrid">${field('Angebots-/Auftragsnummer *','import-offer',s.offer||'')}${field('Kundenname *','import-customer',s.customer||'')}${field('Fahrzeug / Modell *','import-vehicle',s.vehicle||'')}${field('Kennzeichen','import-plate',s.plate||'')}${field('Einbauort / Stadt *','import-place','')}${field('Montagekosten in EUR','import-cost',s.cost||'','number')}<div class="field wide"><label for="import-notes">Hinweise zum Auftrag / Befestigungsart</label><textarea id="import-notes">${esc(s.notes||'')}</textarea></div><div class="field wide"><label for="import-parts">Lie async function readOrderPdf(file){pdfMessage='PDF wird gelesen …';render();let suggest={offer:(file.name.match(/SG[_ -]?\d{4}[_ -]?\d+/i)||[])[0]?.replaceAll('_','-')||''};try{if(!window.pdfjsLib)throw Error('PDF-Texterkennung derzeit nicht verfügbar');let pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer()),disableFontFace:true}).promise,lines=[];for(let p=1;p<=Math.min(pdf.numPages,6);p++){let page=await pdf.getPage(p),items=(await page.getTextContent()).items,byLine=new Map();for(let item of items){let y=Math.round(item.transform[5]/4)*4,arr=byLine.get(y)||[];arr.push(item);byLine.set(y,arr)}for(let row of [...byLine].sort((a,b)=>b[0]-a[0]))lines.push(row[1].sort((a,b)=>a.transform[4]-b.transform[4]).map(x=>x.str).join(' ').replace(/\s+/g,' ').trim())}let text=lines.join('\n');suggest.offer=(text.match(/Angebot\s*Nr\.?\s*:?\s*([A-Z]{1,4}[_ -]?\d{4}[_ -]?\d+[^\n]*)/i)||[])[1]?.split(/Kunden\s*Nr|Angebotsdatum/i)[0]?.trim()||suggest.offer;let c=lines.findIndex(x=>/^Kunde\s*$/i.test(x));if(c>=0)suggest.customer=lines[c+1]?.trim()||'';if(!suggest.customer){let inline=text.match(/(?:^|\n)Kunde\s+([^\n]+?)(?:\s{2,}|$)/im);suggest.customer=inline?.[1]?.trim()||''}let make=(text.match(/Hersteller\s*:\s*([^\n]+)/i)||[])[1]?.trim(),model=(text.match(/Typ\s*:\s*([^\n]+)/i)||[])[1]?.trim();if(make||model)suggest.vehicle=[make,model].filter(Boolean).join(' ').slice(0,100);let cost=(text.match(/Montagekosten\s*:?\s*([\d.,]+)\s*(?:EUR|€)/i)||[])[1];if(cost)suggest.cost=cost.replaceAll('.','').replace(',','.');pdfMessage='Textvorschläge aus dem PDF übernommen, soweit erkennbar. Bitte Kundendaten, Fahrzeug und Termin sorgfältig prüfen.';if(text.replace(/\s/g,'').length<50)pdfMessage='Die PDF enthält kaum auslesbaren Text (möglicherweise ein Scan). Bitte alle Felder manuell eintragen.'}catch(err){pdfMessage='Die PDF konnte nicht automatisch ausgelesen werden. Bitte die Angaben anhand des Dokuments manuell eintragen.'}if(pendingPdf?.file===file){pendingPdf.suggest=suggest;pendingPdf.status='done';render()}}
function isSpecial(section,name){return /sonderposition|elektrik|spannung|wechselrichter|schuko|steckdose|kabel|lift|zubehör|innenlift|innendachträger|schraubstock|drehteller|anschluss|220\s*v|230\s*v|hsr|dsw/i.test(section+' '+name)}
function parseDeliveryRows(pages){let found=[],seen=new Set(),inList=false,section='Konfiguration';for(let pg of pages){let rows=pg.rows;for(let i=0;i<rows.length;i++){let t=rows[i].text.trim();if(/^3\.?\s*Stückliste/i.test(t)){inList=true;continue}if(!inList)continue;if(/Artikel-Nr\.?|Artikelbezeichnung/i.test(t)&&/Pos\.?|Menge/i.test(t)){let heads=rows.slice(Math.max(0,i-3),i).map(x=>x.text.trim()).filter(x=>x&&!/RECA|MAXMOBIL|Fahrzeug|Stückliste|Seite|Pos\.|Artikel-Nr|Angebot/i.test(x));if(heads.length)section=heads.at(-1).slice(0,90);continue}if(/^Seite\s*\d|^74635|^Geschäftsführer|^RECA NORM|^Telefon\b|^Telefax\b/i.test(t))continue;let m=t.match(/^\s*(\d{1,2})\s+((?:\d{11,15})|(?:Schraubstock|Drehteller|Anschluss und Zubehör)[^\n]*)/i);if(!m||/\b(?:min|Einbaukosten|Vormontage|Arbeitswert)\b/i.test(t))continue;let tail=t.slice(m[0].length).trim(),article=/^\d{11,15}$/.test(m[2])?m[2]:'';if(article&&(article.length<11||article.length>15))continue;let qtyCells=rows[i].items.filter(x=>x.x>pg.width*.73&&/^\d{1,3}$/.test(x.str.trim()));let qty=Number(qtyCells.at(-1)?.str.trim()||1);if(!Number.isInteger(qty)||qty<1||qty>999)qty=1;let label=article?tail.replace(/^\d{1,3}\s*/,''):m[2].trim();for(let n=i+1;n<Math.min(i+4,rows.length);n++){let next=rows[n].text.trim();if(/^\d{1,2}\s+(?:\d{11,15}|\d+\s*min\b|Schraubstock|Drehteller|Anschluss und Zubehör)/i.test(next)||/Artikel-Nr\.?|Artikelbezeichnung|^Seite\s*\d/i.test(next))break;if(/^(?:Einbaukosten|Vormontage|Arbeitswert|\d+\s*min)$/i.test(next))break;if(next.length>3&&next.length<150&&rows[n].items.some(x=>x.x<pg.width*.68)){label+=(label?' ':'')+next;break}}label=label.replace(/\s+/g,' ').replace(/^\d{1,3}\s+/,'').trim();if(!label||/^\d+\s*min$/i.test(label)||/^(?:Einbaukosten|Vormontage|Arbeitswert|Einbauhöhe|Fläche|Höhe|Breite)$/i.test(label)||/Visualisierungen/i.test(section))continue;let key=[pg.page,section,article,label].join('|');if(seen.has(key))continue;seen.add(key);found.push({section,article,name:label.slice(0,140),qty,special:isSpecial(section,label),page:pg.page})}}return found}
async function readOrderPdfV2(file){if(!pendingPdf||pendingPdf.file!==file)return;pendingPdf.status='reading';pdfMessage='PDF wird gelesen …';render();let suggest={offer:(file.name.match(/SG[_ -]?\d{4}[_ -]?\d+/i)||[])[0]?.replaceAll('_','-')||'',items:[]};try{if(!window.pdfjsLib)throw Error('PDF-Auslesung nicht verfügbar');let pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer()),disableFontFace:true}).promise,pages=[],all=[];for(let p=1;p<=Math.min(pdf.numPages,60);p++){let page=await pdf.getPage(p),content=await page.getTextContent(),byLine=new Map(),width=page.view[2]-page.view[0];for(let item of content.items){let str=item.str?.trim();if(!str)continue;let y=Math.round(item.transform[5]/3)*3,arr=byLine.get(y)||[];arr.push({str,x:item.transform[4]});byLine.set(y,arr)}let rows=[...byLine].sort((a,b)=>b[0]-a[0]).map(([,items])=>{items.sort((a,b)=>a.x-b.x);return {items,text:items.map(x=>x.str).join(' ').replace(/\s+/g,' ').trim()}});pages.push({page:p,width,rows});all.push(...rows.map(x=>x.text))}let text=all.join('\n');suggest.offer=(text.match(/Angebot\s*Nr\.?\s*:?\s*([A-Z]{1,4}[_ -]?\d{4}[_ -]?\d+[^\n]*)/i)||[])[1]?.split(/Kunden\s*Nr|Angebotsdatum/i)[0]?.trim()||suggest.offer;let c=all.findIndex(x=>/^Kunde\s*$/i.test(x));if(c>=0)suggest.customer=all[c+1]?.trim()||'';let make=(text.match(/Hersteller\s*:\s*([^\n]+)/i)||[])[1]?.trim(),model=(text.match(/Typ\s*:\s*([^\n]+)/i)||[])[1]?.trim();if(make||model)suggest.vehicle=[make,model].filter(Boolean).join(' ').slice(0,100);let cost=(text.match(/Montagekosten\s*:?\s*([\d.,]+)\s*(?:EUR|€)/i)||[])[1];if(cost)suggest.cost=cost.replaceAll('.','').replace(',','.');suggest.items=parseDeliveryRows(pages);pdfMessage=`${suggest.items.length} mögliche Lieferposition(en) aus ${pages.length} PDF-Seite(n) erkannt, davon ${suggest.items.filter(x=>x.special).length} als Sonderposition markiert. Bitte Positionen und Mengen am Original prüfen.`;if(!suggest.items.length)pdfMessage='Keine verlässlichen Lieferpositionen erkannt. Bitte Positionen aus der Stückliste am Original manuell eintragen.';if(pdf.numPages>60)pdfMessage+=' Es wurden nur die ersten 60 Seiten gelesen.'}catch(err){pdfMessage='PDF nicht automatisch lesbar. Bitte Auftrags- und Lieferpositionen anhand des Originals manuell eintragen.'}if(pendingPdf?.file===file){pendingPdf.suggest=suggest;pendingPdf.status='done';render()}}
function saveImported(){if(!partner()||!pendingPdf)return;let get=id=>$('#import-'+id).value.trim(),offer=get('offer'),customer=get('customer'),vehicle=get('vehicle'),place=get('place'),price=get('cost'),cost=price===''?0:Number(price.replace(',','.'));let lines=get('parts').split('\n').map(x=>x.trim()).filter(Boolean),items=[];for(let line of lines){let parts=line.split('|').map(x=>x.trim());if(parts.length!==4||!parts[2]||!/^\d{1,3}$/.test(parts[3])||Number(parts[3])<1){note('Bitte jede Lieferposition im Format Abschnitt | Artikel-Nr. | Bezeichnung | Menge prüfen.');return}items.push({section:parts[0]||'Stückliste',article:parts[1],name:parts[2],qty:Number(parts[3]),received:0,special:isSpecial(parts[0],parts[2])})}if(!offer||!customer||!vehicle||!place||!$('#import-confirm').checked){note('Bitte alle Pflichtfelder ausfüllen und den Originalabgleich bestätigen.');return}if(!items.length){note('Bitte mindestens eine Lieferposition aus der Stückliste erfassen.');return}if(!Number.isFinite(cost)||cost<0){note('Bitte gültige Montagekosten eingeben.');return}if(jobs.some(x=>x.offer.toLowerCase()===offer.toLowerCase())){note('Diese Angebots-/Auftragsnummer existiert bereits. Bitte Duplikat prüfen.');return}let id='MM-IMP-'+String(Date.now()).slice(-7),file=pendingPdf.file,url=URL.createObjectURL(file);let created={id,offer,customer,vehicle,plate:get('plate')||'Nicht angegeben',date:'',time:'',place,planned:cost,notes:get('notes'),parts:items.map(x=>`${x.article?x.article+' · ':''}${x.name} · ${x.qty} St.`),deliveryItems:items,deliveryApproved:false,partner:alias,rep:'Nicht zugewiesen',status:'Lieferung prüfen',checks:{},logs:[],extras:[],messages:[],photos:[],handoverItems:{},handover:{},accept:{},start:null,sourcePdf:{name:file.name,url}};jobs.unshift(created);pendingPdf=null;pdfMessage='';open(id,'delivery');note('Auftrag übernommen: Lieferampel sichtbar; Termin jederzeit planbar.')}

function setupCanvas(){let c=$('#signature');if(!c)return;let dpr=window.devicePixelRatio||1,r=c.getBoundingClientRect();c.width=Math.max(1,Math.round(r.width*dpr));c.height=Math.round(165*dpr);let ctx=c.getContext('2d');ctx.scale(dpr,dpr);ctx.strokeStyle='#18241b';ctx.lineWidth=2;ctx.lineCap='round';ctx.lineJoin='round';let drawing=false;c.dataset.drawn='';c.onpointerdown=e=>{drawing=true;c.setPointerCapture(e.pointerId);ctx.beginPath();let b=c.getBoundingClientRect();ctx.moveTo(e.clientX-b.left,e.clientY-b.top);ctx.lineTo(e.clientX-b.left+.1,e.clientY-b.top+.1);ctx.stroke();c.dataset.drawn='yes'};c.onpointermove=e=>{if(!drawing)return;let b=c.getBoundingClientRect();ctx.lineTo(e.clientX-b.left,e.clientY-b.top);ctx.stroke()};c.onpointerup=()=>drawing=false;c.onpointercancel=()=>drawing=false}
